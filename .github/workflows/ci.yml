name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: for f in bin/herdr-sessions bin/herdr-menu-keys tests/herdr-sessions.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck bin/herdr-sessions bin/herdr-menu-keys tests/herdr-sessions.sh
      - name: session actions
        run: for f in tests/*.cjs; do node "$f" || exit 1; done
      - name: herdr-sessions
        run: bash tests/herdr-sessions.sh
